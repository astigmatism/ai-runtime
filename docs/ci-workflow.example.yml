name: Runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: sh -n scripts/update-and-restart.sh
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} -t ai-runtime:test .
      - run: docker run --rm ai-runtime:test python3 -m unittest discover -s tests -v
